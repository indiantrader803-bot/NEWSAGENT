name: Self-Improving ML Agent

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight
  workflow_dispatch:      # Allow manual trigger

jobs:
  train-model:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Self-Improving ML Agent
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          python self_improving_agent.py
          
          git add ml_trade_model.pkl ml_regime.json || true
          git commit -m "chore(ml): agent self-improvement cycle completed [skip ci]" || echo "No ML changes"
          git push origin main || echo "Push failed or not needed"
