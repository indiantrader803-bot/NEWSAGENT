name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      RENDER_DEPLOY_KEY: ${{ secrets.RENDER_DEPLOY_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server via SSH
        if: env.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            cd ~/deploy/Forexsignal || mkdir -p ~/deploy/Forexsignal && cd ~/deploy/Forexsignal
            git pull || true
            docker compose pull || true
            docker compose up -d --build

      - name: Deploy to Render via Deploy Hook
        if: env.RENDER_DEPLOY_KEY != ''
        run: |
          curl -f -X POST "https://api.render.com/deploy/srv-d9qprjtbedkc73fhjjn0?key=${{ secrets.RENDER_DEPLOY_KEY }}"

      - name: No deployment credentials set
        if: env.DEPLOY_HOST == '' && env.RENDER_DEPLOY_KEY == ''
        run: |
          echo "No deployment credentials found. If you are using Render Auto-Deploy on push, your app will deploy automatically."
